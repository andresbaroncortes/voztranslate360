# VozTranslate 360 — Atlas Business
# Compila, prueba y fotografía la app en un Mac de GitHub (sin Mac propio).
#
# Resultados (pestaña Actions ▸ ejecución ▸ «Artifacts»):
#   • capturas-simulador  → PNG de cada pantalla en modo claro y oscuro
#   • ipa-sin-firmar      → para instalar en el iPhone con Sideloadly (Windows)
#   • registros           → logs de compilación y pruebas (útiles si algo falla)

name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar, probar y capturar
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      PROJECT: VozTranslate360.xcodeproj
      SCHEME: VozTranslate360
      BUNDLE_ID: com.atlasbusiness.VozTranslate360

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Elegir la versión estable más reciente de Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Versiones
        run: |
          sw_vers
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Instalar XcodeGen y generar el proyecto
        run: |
          brew install xcodegen
          xcodegen generate
          mkdir -p logs screenshots

      - name: Elegir simulador de iPhone
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries
            | map(select(.key | contains("iOS")))
            | sort_by(.key | capture("iOS-(?<maj>[0-9]+)-(?<min>[0-9]+)") | [(.maj|tonumber), (.min|tonumber)])
            | last | .value
            | map(select(.name | startswith("iPhone")))
            | first | .udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "::error::No se encontró ningún simulador de iPhone"; exit 1
          fi
          xcrun simctl list devices | grep "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Compilar y ejecutar pruebas (simulador)
        run: |
          LOG=logs/compilacion-y-pruebas.log
          xcodebuild test \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/sim \
            -resultBundlePath build/Pruebas.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            > "$LOG" 2>&1 && STATUS=0 || STATUS=$?
          echo "::group::Errores, avisos y pruebas"
          grep -E "error:|warning:|Test |passed|failed|\*\* " "$LOG" | sort -u | head -400 || true
          echo "::endgroup::"
          if [ "$STATUS" -ne 0 ]; then tail -120 "$LOG"; fi
          exit "$STATUS"

      - name: Capturas de pantalla
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          APP="build/sim/Build/Products/Debug-iphonesimulator/VozTranslate360.app"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 || true
          xcrun simctl uninstall "$UDID" "$BUNDLE_ID" || true
          xcrun simctl install "$UDID" "$APP"

          shoot() {
            local name="$1"; local wait="$2"; shift 2
            xcrun simctl launch --terminate-running-process "$UDID" "$BUNDLE_ID" "$@"
            sleep "$wait"
            xcrun simctl io "$UDID" screenshot "screenshots/$name.png"
          }

          for mode in light dark; do
            xcrun simctl ui "$UDID" appearance "$mode"
            shoot "$mode-1-inicio"        5 -tab traducir
            shoot "$mode-2-conversacion"  5 -demo -tab traducir
            shoot "$mode-3-escuchando"    3 -demo -demo-listen -tab traducir
            shoot "$mode-4-historial"     5 -demo -tab historial
            shoot "$mode-5-ajustes"       5 -tab ajustes
          done
          ls -la screenshots

      - name: Compilar para iPhone (IPA sin firmar)
        run: |
          LOG=logs/compilacion-iphone.log
          xcodebuild build \
            -project "$PROJECT" -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > "$LOG" 2>&1 && STATUS=0 || STATUS=$?
          grep -E "error:|warning:|\*\* " "$LOG" | sort -u | head -200 || true
          if [ "$STATUS" -ne 0 ]; then tail -120 "$LOG"; fi
          exit "$STATUS"

      - name: Empaquetar IPA
        run: |
          mkdir -p ipa/Payload
          cp -R build/device/Build/Products/Release-iphoneos/VozTranslate360.app ipa/Payload/
          (cd ipa && zip -qry ../VozTranslate360-sin-firmar.ipa Payload)
          ls -la VozTranslate360-sin-firmar.ipa

      - name: Subir capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-simulador
          path: screenshots/
          if-no-files-found: ignore

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: ipa-sin-firmar
          path: VozTranslate360-sin-firmar.ipa

      - name: Subir registros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registros
          path: |
            logs/
            build/Pruebas.xcresult
          if-no-files-found: ignore
